apiVersion: apps/v1
kind: Deployment
metadata:
  name: tabulae-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tabulae-backend
  template:
    metadata:
      labels:
        app: tabulae-backend
    spec:
      containers:
        - name: backend
          image: tabulae-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: tabulae-app-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: tabulae-backend
spec:
  selector:
    app: tabulae-backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
