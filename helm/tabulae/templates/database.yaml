apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tabulae-db-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.database.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  selector:
    app: tabulae-db
  ports:
    - port: {{ .Values.database.port }}
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tabulae-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tabulae-db
  template:
    metadata:
      labels:
        app: tabulae-db
    spec:
      containers:
        - name: postgres
          image: {{ .Values.database.image }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: tabulae-app-secret
                  key: TABULAE_DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tabulae-app-secret
                  key: TABULAE_DB_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: tabulae-app-secret
                  key: TABULAE_DB_NAME
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: database-data
              mountPath: /var/lib/postgresql/data
            - name: db-init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: database-data
          persistentVolumeClaim:
            claimName: tabulae-db-data
        - name: db-init
          configMap:
            name: tabulae-db-init
