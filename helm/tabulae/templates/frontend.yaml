apiVersion: apps/v1
kind: Deployment
metadata:
  name: tabulae-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tabulae-frontend
  template:
    metadata:
      labels:
        app: tabulae-frontend
    spec:
      containers:
        - name: frontend
          image: {{ .Values.frontend.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: tabulae-frontend
spec:
  selector:
    app: tabulae-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: {{ .Values.service.frontendNodePort }}
  type: NodePort
  nodePort: 30080
