name: Tabulae CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Backend Dependencies
        working-directory: backend
        run: pip install -r requirements.txt
        
      - name: Map test database hostname
        run: echo "127.0.0.1 db_test" | sudo tee -a /etc/hosts  

      - name: Run backend tests
        working-directory: backend
        env:
          PYTHONPATH: .
          SECRET_KEY: ci-test-secret-key-not-for-production
          DATABASE_URL: postgresql+asyncpg://test_user:test_pass@127.0.0.1:5432/test_db
        run: pytest app/tests -v

  frontend-checks:
    name: Frontend lint and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Up Node js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci 

      - name: Run frontend lint 
        run: npm run lint 

      - name: Build frontend
        run: npm run build          

  docker-build:
    name: Validate Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: docker build -f backend/Dockerfile -t tabulae-backend:ci backend
      
      - name: Scan Backend Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tabulae-backend:ci
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Build frontend Docker Image
        run: docker build -f frontend/Dockerfile -t tabulae-frontend:ci frontend

      - name: Scan Frontend Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tabulae-frontend:ci
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '0'
  
  publish-ecr:
    name: Publish images to Amazon ECR
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-checks, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );
            console.log('OIDC issuer:', payload.iss);
            console.log('OIDC audience:', payload.aud);
            console.log('OIDC subject:', payload.sub);
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          REGISTRY: 482972685106.dkr.ecr.us-east-1.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f backend/Dockerfile \
            -t "$REGISTRY/tabulae-backend:$IMAGE_TAG" backend
          docker push "$REGISTRY/tabulae-backend:$IMAGE_TAG"
          docker tag "$REGISTRY/tabulae-backend:$IMAGE_TAG" \
            "$REGISTRY/tabulae-backend:latest"
          docker push "$REGISTRY/tabulae-backend:latest"

      - name: Build and push frontend image
        env:
          REGISTRY: 482972685106.dkr.ecr.us-east-1.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f frontend/Dockerfile \
            --build-arg VITE_API_URL=http://localhost:8001 \
            -t "$REGISTRY/tabulae-frontend:$IMAGE_TAG" frontend
          docker push "$REGISTRY/tabulae-frontend:$IMAGE_TAG"
          docker tag "$REGISTRY/tabulae-frontend:$IMAGE_TAG" \
            "$REGISTRY/tabulae-frontend:latest"
          docker push "$REGISTRY/tabulae-frontend:latest"
